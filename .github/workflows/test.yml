name: Test

permissions: {}

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Java ${{ matrix.java }}${{ matrix.keycloak && format(', Keycloak {0}', matrix.keycloak) || '' }})
    timeout-minutes: 40
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        java:
          - 21
          - 25
        keycloak:
          - ''
        include:
          - java: 21
            keycloak: ''
            chooser: true
          - java: 21
            keycloak: 26.8.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDKs
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: |
            ${{ matrix.java }}
            21
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install the display tools
        if: matrix.chooser
        run: sudo apt-get install -y xvfb xdotool imagemagick

      - name: Install the browser
        run: ./gradlew installBrowser -PplaywrightDeps ${{ matrix.chooser && '-Pchooser' || '' }}

      - name: Pull the images in the background
        env:
          KEYCLOAK_VERSION: ${{ matrix.keycloak }}
        run: |
          ./gradlew -q printTestImages -PtestKeycloakVersion="$KEYCLOAK_VERSION" > "$RUNNER_TEMP/images"
          xargs -P 2 -n 1 docker pull < "$RUNNER_TEMP/images" > /dev/null 2>&1 &

      - name: Run Tests
        env:
          KEYCLOAK_VERSION: ${{ matrix.keycloak }}
        run: ${{ matrix.chooser && 'xvfb-run -a -s "-screen 0 1280x1024x24" ' || '' }}./gradlew check -PtestJavaVersion=${{ matrix.java }} -PtestKeycloakVersion="$KEYCLOAK_VERSION" ${{ matrix.chooser && '-Pchooser' || '' }}

      - name: Show the chooser result
        if: always() && matrix.chooser
        run: grep -o '<testcase name="theChooser[^>]*>' build/test-results/integrationTest/TEST-net.exoego.keycloak.crossrealm.PasskeysInSeveralRealmsIT.xml; grep -c '<skipped' build/test-results/integrationTest/TEST-net.exoego.keycloak.crossrealm.PasskeysInSeveralRealmsIT.xml || true

      - name: Upload coverage to Codecov
        if: matrix.java == 21 && matrix.keycloak == ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml
          disable_search: true
          fail_ci_if_error: false

  # A new job of this workflow must be added to "needs".
  gate:
    name: Test gate
    timeout-minutes: 5
    # A skipped required job counts as passed, so run always and fail by hand.
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
